<style>
:root {
  --void: #0B0D10;
  --graphite: #1F1A16;
  --bronze: #B88A44;
  --gold: #E2C48D;
  --chalk: #F5F5F5;
  --muted: #A7A7A7;
  --border: rgba(184, 138, 68, 0.12);
  --glass: rgba(31, 26, 22, 0.7);
  --glass-border: rgba(184, 138, 68, 0.08);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--void);
  color: var(--chalk);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.bg-pattern {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(184, 138, 68, 0.06), transparent),
    radial-gradient(ellipse 60% 40% at 80% 60%, rgba(184, 138, 68, 0.03), transparent);
}

.bg-grid {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(184, 138, 68, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(184, 138, 68, 0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black, transparent);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black, transparent);
}

@media (prefers-reduced-motion: reduce) {
  .bg-pattern, .bg-grid { animation: none !important; }
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  position: relative;
  z-index: 1;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 16px 0;
  background: rgba(11, 13, 16, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

nav .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--chalk);
}

.nav-brand img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
}

.nav-brand span {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
  list-style: none;
}

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: color 0.2s;
}

.nav-links a:hover {
  color: var(--gold);
}

.nav-cta {
  padding: 8px 20px;
  background: var(--bronze);
  color: var(--void) !important;
  border-radius: 8px;
  font-weight: 600 !important;
  transition: all 0.2s !important;
}

.nav-cta:hover {
  background: var(--gold) !important;
  color: var(--void) !important;
}

@media (max-width: 768px) {
  .nav-links { display: none; }
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 24px 80px;
}

.hero-content {
  max-width: 800px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
  font-size: 0.8rem;
  color: var(--gold);
  margin-bottom: 32px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--bronze);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@media (prefers-reduced-motion: reduce) {
  .hero-badge::before { animation: none; }
}

h1 {
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 24px;
  background: linear-gradient(135deg, var(--chalk) 0%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-subtitle {
  font-size: clamp(1.1rem, 3vw, 1.35rem);
  color: var(--muted);
  margin-bottom: 40px;
  line-height: 1.5;
}

.hero-cta {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 14px 32px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: none;
  cursor: pointer;
}

.btn-primary {
  background: var(--bronze);
  color: var(--void);
}

.btn-primary:hover {
  background: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(184, 138, 68, 0.3);
}

.btn-secondary {
  background: var(--glass);
  color: var(--chalk);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.btn-secondary:hover {
  background: rgba(31, 26, 22, 0.9);
  border-color: var(--bronze);
}

section {
  padding: 100px 0;
  position: relative;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 64px;
}

.section-label {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 0.75rem;
  color: var(--bronze);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 16px;
  display: block;
}

h2 {
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
}

.section-desc {
  font-size: 1.1rem;
  color: var(--muted);
  line-height: 1.6;
}

.capabilities {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  margin-top: 48px;
}

.capability-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 32px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.capability-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--bronze), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.capability-card:hover {
  border-color: var(--border);
  transform: translateY(-4px);
}

.capability-card:hover::before {
  opacity: 1;
}

.capability-icon {
  width: 48px;
  height: 48px;
  background: rgba(184, 138, 68, 0.1);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  font-size: 1.5rem;
}

.capability-card h3 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}

.capability-card p {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.6;
}

.architecture {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 48px 32px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  margin-top: 48px;
}

.arch-flow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.arch-node {
  background: rgba(11, 13, 16, 0.8);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 32px;
  text-align: center;
  width: 100%;
  max-width: 400px;
  transition: all 0.3s;
}

.arch-node:hover {
  border-color: var(--bronze);
  transform: scale(1.02);
}

.arch-node-label {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 0.75rem;
  color: var(--bronze);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

.arch-node-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--chalk);
}

.arch-arrow {
  width: 2px;
  height: 32px;
  background: linear-gradient(to bottom, var(--bronze), transparent);
  position: relative;
}

.arch-arrow::after {
  content: '↓';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--bronze);
  font-size: 1.2rem;
}

@media (min-width: 768px) {
  .arch-flow {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
  }
  .arch-node {
    width: auto;
    min-width: 200px;
  }
  .arch-arrow {
    width: 32px;
    height: 2px;
    background: linear-gradient(to right, var(--bronze), transparent);
  }
  .arch-arrow::after {
    content: '→';
    bottom: 50%;
    left: auto;
    right: -8px;
    transform: translateY(50%);
  }
}

.mobile-advantage {
  display: grid;
  grid-template-columns: 1fr;
  gap: 48px;
  align-items: center;
  margin-top: 48px;
}

@media (min-width: 768px) {
  .mobile-advantage {
    grid-template-columns: 1fr 1fr;
  }
}

.advantage-text h3 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.advantage-text p {
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.7;
  margin-bottom: 16px;
}

.advantage-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.advantage-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  color: var(--muted);
  font-size: 0.95rem;
}

.advantage-list li::before {
  content: '→';
  color: var(--bronze);
  font-weight: 700;
  flex-shrink: 0;
}

.device-frame {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 16px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 300px;
}

.device-frame img {
  max-width: 100%;
  max-height: 400px;
  border-radius: 12px;
}

.device-placeholder {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.device-placeholder .device-icon {
  font-size: 3rem;
  margin-bottom: 12px;
  display: block;
}

.tech-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 48px;
}

.tech-item {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.tech-item:hover {
  border-color: var(--border);
  transform: translateY(-2px);
}

.tech-icon {
  font-size: 2rem;
  margin-bottom: 12px;
}

.tech-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--chalk);
  margin-bottom: 4px;
}

.tech-desc {
  font-size: 0.8rem;
  color: var(--muted);
}

.open-source {
  background: linear-gradient(135deg, rgba(184, 138, 68, 0.05), rgba(31, 26, 22, 0.3));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 64px 32px;
  text-align: center;
  margin-top: 48px;
}

.open-source h3 {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.open-source p {
  color: var(--muted);
  font-size: 1.1rem;
  margin-bottom: 32px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.license-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(184, 138, 68, 0.1);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 0.8rem;
  color: var(--gold);
  margin-top: 24px;
}

.roadmap {
  display: grid;
  gap: 24px;
  margin-top: 48px;
}

.roadmap-item {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 32px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.roadmap-marker {
  width: 48px;
  height: 48px;
  background: rgba(184, 138, 68, 0.1);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.5rem;
}

.roadmap-content h4 {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.roadmap-content p {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.6;
}

.final-cta {
  text-align: center;
  padding: 120px 24px;
  background: linear-gradient(180deg, transparent, rgba(184, 138, 68, 0.03));
}

.final-cta h2 {
  font-size: clamp(2rem, 6vw, 3.5rem);
  margin-bottom: 24px;
}

.final-cta p {
  font-size: 1.2rem;
  color: var(--muted);
  margin-bottom: 40px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

footer {
  border-top: 1px solid var(--border);
  padding: 48px 0 32px;
  background: rgba(11, 13, 16, 0.5);
}

.footer-content {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
  margin-bottom: 32px;
}

@media (min-width: 768px) {
  .footer-content {
    grid-template-columns: 2fr 1fr 1fr 1fr;
  }
}

.footer-brand {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.footer-brand img {
  width: 48px;
  height: 48px;
  border-radius: 10px;
}

.footer-brand p {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.6;
}

.footer-section h4 {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
  color: var(--chalk);
}

.footer-section ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.footer-section a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.2s;
}

.footer-section a:hover {
  color: var(--gold);
}

.footer-bottom {
  padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  text-align: center;
}

@media (min-width: 768px) {
  .footer-bottom {
    flex-direction: row;
    justify-content: space-between;
  }
}

.footer-bottom p {
  color: var(--muted);
  font-size: 0.85rem;
}

<section id="what">
  <div class="container">
    <div class="section-header">
      <span class="section-label">What is Nexon</span>
      <h2>Mobile-First Agentic Development</h2>
      <p class="section-desc">Nexon is an AI-powered mobile development and research environment designed to bring agentic workflows to Android through Termux. It combines an interactive Flutter UI with a local Python bridge to orchestrate shell execution, file manipulation, live web search, and multi-agent deep research loops directly on your phone.</p>
    </div>
  </div>
</section>

<section id="capabilities">
  <div class="container">
    <div class="section-header">
      <span class="section-label">Capabilities</span>
      <h2>Built for Real Development Workflows</h2>
      <p class="section-desc">Everything you need to build, research, and automate from your Android device.</p>
    </div>
    <div class="capabilities">
      <div class="capability-card">
        <div class="capability-icon">⚡</div>
        <h3>Agentic IDE</h3>
        <p>LLM agents execute commands directly inside the Termux shell, supporting compilers, tests, and script runners with rich file manipulation and security permission controls.</p>
      </div>
      <div class="capability-card">
        <div class="capability-icon">🔍</div>
        <h3>Deep Research Engine</h3>
        <p>3-agent autonomous pipeline moving through Planner, Researcher, and Synthesizer phases with structured fact and finding storage for maximum response quality.</p>
      </div>
      <div class="capability-card">
        <div class="capability-icon">🌐</div>
        <h3>Live Web Search</h3>
        <p>Real-time web context via Tavily API integration. The app intercepts search requests during chat sessions and routes them natively for up-to-date information.</p>
      </div>
      <div class="capability-card">
        <div class="capability-icon">📄</div>
        <h3>Artifact Rendering</h3>
        <p>Renders rich markdown documents, syntax-highlighted code, and interactive SVG diagrams directly in the chat feed. Export artifacts as .md or .docx files.</p>
      </div>
      <div class="capability-card">
        <div class="capability-icon">☁️</div>
        <h3>Cloud Backup & Sync</h3>
        <p>Unified Google Drive sync bundles conversation sessions, settings, and credentials into a single backup with smart non-destructive merging.</p>
      </div>
      <div class="capability-card">
        <div class="capability-icon">🔧</div>
        <h3>Termux Integration</h3>
        <p>Full access to the Termux runtime environment — bash shell, GCC, git, Python, and all standard Unix tools running natively on your Android device.</p>
      </div>
    </div>
  </div>
</section>

<section id="architecture">
  <div class="container">
    <div class="section-header">
      <span class="section-label">Architecture</span>
      <h2>How Nexon Works</h2>
      <p class="section-desc">A split-process architecture between the Flutter application and a local Python bridge server running in Termux.</p>
    </div>
    <div class="architecture">
      <div class="arch-flow">
        <div class="arch-node">
          <div class="arch-node-label">Layer 1</div>
          <div class="arch-node-title">Flutter UI</div>
        </div>
        <div class="arch-arrow"></div>
        <div class="arch-node">
          <div class="arch-node-label">Layer 2</div>
          <div class="arch-node-title">WebSocket / HTTP Bridge</div>
        </div>
        <div class="arch-arrow"></div>
        <div class="arch-node">
          <div class="arch-node-label">Layer 3</div>
          <div class="arch-node-title">Python Bridge Server</div>
        </div>
